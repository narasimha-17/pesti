services:
  # Backend API (FastAPI)
  - type: web
    name: agrimart-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.5
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        value: sqlite:///./agrimart.db

  # Website (Vite build served as a static site). /api/* is proxied to the backend,
  # so the browser only talks to one origin and no CORS setup is needed.
  - type: web
    name: agrimart-web
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /api/*
        destination: https://pesti-jma8.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
